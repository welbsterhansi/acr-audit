[project]
name = "acr-audit"
version = "0.1.0"
description = "POC: auditoria de governança de imagens em Azure Container Registry via labels herdadas."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
acr-audit = "audit:main"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "TID",  # tidy imports
    "N",    # pep8-naming
]
ignore = [
    "PLR0913",  # too many args: CLI entrypoints legitimamente têm muitos
    "PLR2004",  # magic numbers: aceitável em testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
